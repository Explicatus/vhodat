# Локален продукционен стек: PostgreSQL + приложението.
# Преди старт: в prisma/schema.prisma сменете provider = "postgresql".
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vhodat, POSTGRES_PASSWORD: vhodat, POSTGRES_DB: vhodat }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vhodat:vhodat@db:5432/vhodat
    depends_on: [db]
volumes:
  pgdata:
