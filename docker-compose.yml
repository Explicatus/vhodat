# Локален стек: PostgreSQL + приложението.
# Само база за разработка: `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vhodat, POSTGRES_PASSWORD: vhodat, POSTGRES_DB: vhodat }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vhodat:vhodat@db:5432/vhodat
    depends_on: [db]
volumes:
  pgdata:
