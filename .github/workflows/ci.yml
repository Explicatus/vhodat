name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vhodat
          POSTGRES_PASSWORD: vhodat
          POSTGRES_DB: vhodat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vhodat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vhodat:vhodat@localhost:5432/vhodat
      SESSION_SECRET: ci-session-secret-not-for-production-0123456789
      APP_URL: http://localhost:3100
      PAYMENTS_MOCK: "1"
      CRON_SECRET: test-cron-secret
      PLATFORM_FEE_PERCENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check schema and migrations are in sync
        # базата след миграциите трябва да съвпада точно със schema.prisma (забравена миграция → грешка)
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests (unit + e2e)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
